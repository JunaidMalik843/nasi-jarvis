<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="core" cx="50%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#7cf5ec"/>
      <stop offset="38%" stop-color="#1e7682"/>
      <stop offset="78%" stop-color="#0c2a30"/>
      <stop offset="100%" stop-color="#050a0c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ee0d6" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#24bdcc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#24bdcc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#1d4d54" stroke-width="1.2" opacity="0.7"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#1d4d54" stroke-width="0.6" stroke-dasharray="2.4 3.6" opacity="0.55"/>
  <!-- Orbit arc -->
  <path d="M 8 32 A 24 24 0 1 1 56 32" fill="none" stroke="#26c7db" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>
  <!-- Base disc -->
  <circle cx="32" cy="32" r="19" fill="url(#core)"/>
  <!-- Inner core glow -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.9"/>
  <!-- Center orb -->
  <circle cx="32" cy="32" r="8" fill="#0d2428" stroke="#3ee0d6" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="3.2" fill="#7cf5ec"/>
  <!-- Circuit node marks -->
  <circle cx="18" cy="20" r="1.4" fill="#3ee0d6" opacity="0.9"/>
  <circle cx="47" cy="20" r="1.4" fill="#3ee0d6" opacity="0.9"/>
  <circle cx="18" cy="45" r="1.4" fill="#3ee0d6" opacity="0.9"/>
  <circle cx="47" cy="45" r="1.4" fill="#3ee0d6" opacity="0.9"/>
  <!-- HUD ticks -->
  <g stroke="#3ee0d6" stroke-width="0.8" opacity="0.55">
    <line x1="32" y1="4" x2="32" y2="7"/>
    <line x1="32" y1="57" x2="32" y2="60"/>
    <line x1="4" y1="32" x2="7" y2="32"/>
    <line x1="57" y1="32" x2="60" y2="32"/>
  </g>
</svg>
